name: Build LineageOS 16.0 Kernel for serranoltexx

on:
  workflow_dispatch:
  push:
    paths:
      - '*.patch'
      - '.github/workflows/build-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_samsung_msm8930-common
        ref: lineage-16.0
        path: kernel

    - name: Checkout patch repository (this repo)
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Verify kernel commit
      run: |
        set -euo pipefail
        cd kernel
        git log -1 --format="%H %s"
        test "$(git rev-parse --short=8 HEAD)" = "ce60f1d1" || { echo "ERROR: Unexpected kernel commit"; exit 1; }

    - name: Install Python 2.7 (kernel 3.4 requires Python 2)
      run: |
        set -euo pipefail
        echo "=== Installing Python 2.7 ==="
        sudo apt-get update
        sudo apt-get install -y python2.7 python2.7-dev
        mkdir -p "$HOME/bin"
        ln -sf /usr/bin/python2.7 "$HOME/bin/python"
        echo "$HOME/bin" >> "$GITHUB_PATH"
        command -v python
        python --version
        python2.7 --version
        echo "=== Python 2.7 installed ==="

    - name: Install base dependencies (no toolchain)
      run: |
        set -euo pipefail
        echo "=== Installing base dependencies ==="
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git python3 python3-dev \
          gcc g++ make libssl-dev libelf-dev libncurses5-dev \
          flex bison bc cpio kmod liblz4-tool xz-utils wget ca-certificates
        echo "=== Base dependencies installed ==="

    - name: Setup Android NDK (pre-installed on runner)
      uses: android-actions/setup-android@v3
      with:
        ndk-version: r25c
        api-level: 28

    - name: Verify NDK ARM toolchain
      run: |
        set -euo pipefail
        echo "=== Verifying NDK toolchain ==="
        # NDK r25c provides arm-linux-androideabi-* toolchain
        # Use it with bare-metal prefix by creating symlinks
        export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
        echo "NDK root: ${ANDROID_NDK_ROOT}"
        find "${ANDROID_NDK_ROOT}" -name "*arm*gcc*" -type f 2>/dev/null | head -10
        
        # Use the NDK's arm-linux-androideabi toolchain
        export CROSS_COMPILE=arm-linux-androideabi-
        command -v ${CROSS_COMPILE}gcc
        ${CROSS_COMPILE}gcc --version
        command -v ${CROSS_COMPILE}ld
        command -v ${CROSS_COMPILE}objcopy
        echo "=== NDK toolchain verified ==="

    - name: Apply patch
      run: |
        set -euo pipefail
        cd kernel
        git apply ../repo/rt_fill_info_null_fix.patch

    - name: Configure kernel
      run: |
        set -euo pipefail
        cd kernel
        make ARCH=arm CROSS_COMPILE=arm-linux-androideabi- samsung_serrano_defconfig VARIANT_DEFCONFIG=msm8930_serrano_eur_lte_defconfig

    - name: Build kernel
      run: |
        set -euo pipefail
        cd kernel
        make ARCH=arm CROSS_COMPILE=arm-linux-androideabi- -j$(nproc) 2>&1 | tee build.log

    - name: Verify artifacts
      run: |
        set -euo pipefail
        cd kernel
        test -f arch/arm/boot/zImage && test -s arch/arm/boot/zImage
        test -f arch/arm/boot/zImage-dtb && test -s arch/arm/boot/zImage-dtb
        ls -la arch/arm/boot/zImage*
        file arch/arm/boot/zImage
        echo "=== ARTIFACTS ARE zImage/zImage-dtb ONLY ==="
        echo "=== NOT A FLASHABLE boot.img ==="

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/build.log
        retention-days: 30

    - name: Upload kernel artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          kernel/arch/arm/boot/zImage
          kernel/arch/arm/boot/zImage-dtb
        retention-days: 30
