name: Build LineageOS 16.0 Kernel for serranoltexx

on:
  workflow_dispatch:
  push:
    paths:
      - '*.patch'
      - '.github/workflows/build-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_samsung_msm8930-common
        ref: lineage-16.0
        path: kernel

    - name: Checkout patch repository (this repo)
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Verify kernel commit
      run: |
        set -euo pipefail
        cd kernel
        git log -1 --format="%H %s"
        test "$(git rev-parse --short=8 HEAD)" = "ce60f1d1" || { echo "ERROR: Unexpected kernel commit"; exit 1; }

    - name: Install Python 2.7 (kernel 3.4 requires Python 2)
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq
        sudo apt-get install -y -qq python2.7 python2.7-dev
        mkdir -p "$HOME/bin"
        ln -sf /usr/bin/python2.7 "$HOME/bin/python"
        echo "$HOME/bin" >> "$GITHUB_PATH"
        command -v python
        python --version
        python2.7 --version

    - name: Install base dependencies (no toolchain)
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          git python3 python3-dev \
          gcc g++ make libssl-dev libelf-dev libncurses5-dev \
          flex bison bc cpio kmod liblz4-tool xz-utils wget ca-certificates

    - name: Diagnose available ARM toolchains
      run: |
        set -euo pipefail
        echo "=== Checking pre-installed toolchains ==="
        which arm-none-eabi-gcc || echo "arm-none-eabi-gcc: NOT FOUND"
        which arm-eabi-gcc || echo "arm-eabi-gcc: NOT FOUND"
        which arm-linux-gnueabi-gcc || echo "arm-linux-gnueabi-gcc: NOT FOUND"
        which arm-linux-androideabi-gcc || echo "arm-linux-androideabi-gcc: NOT FOUND"
        which arm-none-eabi-clang || echo "arm-none-eabi-clang: NOT FOUND"
        which clang || echo "clang: NOT FOUND"
        
        # Check NDK locations
        echo "=== Checking NDK locations ==="
        for p in /usr/local/lib/android/sdk/ndk /opt/android/ndk /usr/lib/android/sdk/ndk; do
          if [ -d "$p" ]; then
            echo "Found: $p"
            ls -la "$p"
            find "$p" -name "*arm*gcc*" -type f 2>/dev/null | head -10
          fi
        done
        
        # Check for NDK in standard env vars
        echo "ANDROID_NDK_HOME: ${ANDROID_NDK_HOME:-NOT SET}"
        echo "ANDROID_NDK_ROOT: ${ANDROID_NDK_ROOT:-NOT SET}"
        
        # List all arm-* compilers in PATH
        echo "=== All arm-* compilers in PATH ==="
        for cmd in arm-none-eabi-gcc arm-eabi-gcc arm-linux-gnueabi-gcc arm-linux-androideabi-gcc arm-none-eabi-clang clang; do
          if command -v $cmd >/dev/null 2>&1; then
            echo "FOUND: $cmd -> $(command -v $cmd)"
            $cmd --version | head -1
          fi
        done

    - name: Select and verify ARM toolchain
      run: |
        set -euo pipefail
        # Priority order for kernel builds
        if command -v arm-none-eabi-gcc >/dev/null 2>&1; then
          export CROSS_COMPILE=arm-none-eabi-
        elif command -v arm-eabi-gcc >/dev/null 2>&1; then
          export CROSS_COMPILE=arm-eabi-
        elif command -v arm-linux-gnueabi-gcc >/dev/null 2>&1; then
          export CROSS_COMPILE=arm-linux-gnueabi-
        elif command -v arm-linux-androideabi-gcc >/dev/null 2>&1; then
          export CROSS_COMPILE=arm-linux-androideabi-
        else
          echo "ERROR: No ARM cross-compiler found in PATH"
          exit 1
        fi
        
        command -v ${CROSS_COMPILE}gcc
        ${CROSS_COMPILE}gcc --version
        command -v ${CROSS_COMPILE}ld
        command -v ${CROSS_COMPILE}objcopy
        echo "CROSS_COMPILE=${CROSS_COMPILE}" >> $GITHUB_ENV

    - name: Apply patch
      run: |
        set -euo pipefail
        cd kernel
        git apply ../repo/rt_fill_info_null_fix.patch

    - name: Configure kernel
      run: |
        set -euo pipefail
        cd kernel
        make ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} samsung_serrano_defconfig VARIANT_DEFCONFIG=msm8930_serrano_eur_lte_defconfig

    - name: Build kernel
      run: |
        set -euo pipefail
        cd kernel
        make ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} -j$(nproc) 2>&1 | tee build.log

    - name: Verify artifacts
      run: |
        set -euo pipefail
        cd kernel
        test -f arch/arm/boot/zImage && test -s arch/arm/boot/zImage
        test -f arch/arm/boot/zImage-dtb && test -s arch/arm/boot/zImage-dtb
        ls -la arch/arm/boot/zImage*
        file arch/arm/boot/zImage
        echo "=== ARTIFACTS ARE zImage/zImage-dtb ONLY ==="
        echo "=== NOT A FLASHABLE boot.img ==="

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/build.log
        retention-days: 30

    - name: Upload kernel artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          kernel/arch/arm/boot/zImage
          kernel/arch/arm/boot/zImage-dtb
        retention-days: 30
