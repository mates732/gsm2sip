name: Build LineageOS 16.0 Kernel for serranoltexx

on:
  workflow_dispatch:
  push:
    paths:
      - '*.patch'
      - '.github/workflows/build-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_samsung_msm8930-common
        ref: lineage-16.0
        path: kernel

    - name: Checkout patch repository (this repo)
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Verify kernel commit
      run: |
        set -euo pipefail
        cd kernel
        git log -1 --format="%H %s"
        test "$(git rev-parse --short=8 HEAD)" = "ce60f1d1" || { echo "ERROR: Unexpected kernel commit"; exit 1; }

    - name: Install Python 2.7 (kernel 3.4 requires Python 2)
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq
        sudo apt-get install -y -qq python2.7 python2.7-dev
        mkdir -p "$HOME/bin"
        ln -sf /usr/bin/python2.7 "$HOME/bin/python"
        echo "$HOME/bin" >> "$GITHUB_PATH"
        command -v python
        python --version
        python2.7 --version

    - name: Install base dependencies (no toolchain)
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          git python3 python3-dev \
          gcc g++ make libssl-dev libelf-dev libncurses5-dev \
          flex bison bc cpio kmod liblz4-tool xz-utils wget ca-certificates

    - name: Locate and verify pre-installed NDK bare-metal toolchain
      run: |
        set -euo pipefail
        # GitHub ubuntu-22.04 runners have NDK pre-installed
        NDK_PATHS=(
          "/usr/local/lib/android/sdk/ndk"
          "/opt/android/ndk"
          "$ANDROID_NDK_HOME"
          "$ANDROID_NDK_ROOT"
          "/usr/lib/android/sdk/ndk"
        )
        NDK_ROOT=""
        for p in "${NDK_PATHS[@]}"; do
          if [ -d "$p" ]; then
            LATEST=$(ls -1 "$p" 2>/dev/null | sort -V | tail -1)
            if [ -n "$LATEST" ] && [ -d "$p/$LATEST" ]; then
              NDK_ROOT="$p/$LATEST"
              break
            fi
          fi
        done
        if [ -z "$NDK_ROOT" ]; then
          echo "ERROR: NDK not found in standard locations"
          find /usr -name "*ndk*" -type d 2>/dev/null | head -10
          exit 1
        fi
        echo "Found NDK at: $NDK_ROOT"
        
        # Look for toolchain in NDK
        TOOLCHAIN_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        if [ ! -d "$TOOLCHAIN_BIN" ]; then
          TOOLCHAIN_BIN=$(find "$NDK_ROOT" -name "*arm*gcc*" -type f 2>/dev/null | head -1 | xargs dirname)
        fi
        if [ ! -d "$TOOLCHAIN_BIN" ]; then
          echo "ERROR: Toolchain bin not found in NDK"
          find "$NDK_ROOT" -name "*arm*gcc*" -type f 2>/dev/null | head -10
          exit 1
        fi
        echo "Toolchain bin: $TOOLCHAIN_BIN"
        
        # Try NDK's clang first (better for older kernels)
        if [ -f "$TOOLCHAIN_BIN/clang" ]; then
          echo "Using NDK clang with bare-metal target"
          export CC=clang
          export CROSS_COMPILE=arm-none-eabi-
          export PATH="$TOOLCHAIN_BIN:$PATH"
        elif [ -f "$TOOLCHAIN_BIN/arm-none-eabi-gcc" ]; then
          export CROSS_COMPILE=arm-none-eabi-
          TOOLCHAIN_PATH="$TOOLCHAIN_BIN"
        elif [ -f "$TOOLCHAIN_BIN/arm-eabi-gcc" ]; then
          export CROSS_COMPILE=arm-eabi-
          TOOLCHAIN_PATH="$TOOLCHAIN_BIN"
        elif [ -f "$TOOLCHAIN_BIN/arm-linux-gnueabi-gcc" ]; then
          export CROSS_COMPILE=arm-linux-gnueabi-
          TOOLCHAIN_PATH="$TOOLCHAIN_BIN"
        elif [ -f "$TOOLCHAIN_BIN/arm-linux-androideabi-gcc" ]; then
          export CROSS_COMPILE=arm-linux-androideabi-
          TOOLCHAIN_PATH="$TOOLCHAIN_BIN"
        else
          echo "ERROR: No suitable ARM compiler found"
          ls -la "$TOOLCHAIN_BIN" | grep -E "arm.*gcc"
          exit 1
        fi
        
        if [ -n "$TOOLCHAIN_PATH" ]; then
          export PATH="$TOOLCHAIN_PATH:$PATH"
        fi
        
        # If using clang, verify it works for bare-metal
        if [ "$CC" = "clang" ]; then
          clang --version
          echo "Using clang with target arm-none-eabi"
          export CROSS_COMPILE=arm-none-eabi-
          export PATH="$TOOLCHAIN_BIN:$PATH"
        else
          export PATH="$TOOLCHAIN_PATH:$PATH"
        fi
        
        command -v ${CROSS_COMPILE}gcc
        ${CROSS_COMPILE}gcc --version
        command -v ${CROSS_COMPILE}ld
        command -v ${CROSS_COMPILE}objcopy
        echo "CROSS_COMPILE=${CROSS_COMPILE}" >> $GITHUB_ENV
        if [ -n "$CC" ]; then
          echo "CC=${CC}" >> $GITHUB_ENV
        fi
        if [ -n "$TOOLCHAIN_PATH" ]; then
          echo "PATH=$TOOLCHAIN_PATH:\$PATH" >> $GITHUB_ENV
        fi

    - name: Apply patch
      run: |
        set -euo pipefail
        cd kernel
        git apply ../repo/rt_fill_info_null_fix.patch

    - name: Configure kernel
      run: |
        set -euo pipefail
        cd kernel
        make ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} samsung_serrano_defconfig VARIANT_DEFCONFIG=msm8930_serrano_eur_lte_defconfig

    - name: Build kernel
      run: |
        set -euo pipefail
        cd kernel
        make ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} -j$(nproc) 2>&1 | tee build.log

    - name: Verify artifacts
      run: |
        set -euo pipefail
        cd kernel
        test -f arch/arm/boot/zImage && test -s arch/arm/boot/zImage
        test -f arch/arm/boot/zImage-dtb && test -s arch/arm/boot/zImage-dtb
        ls -la arch/arm/boot/zImage*
        file arch/arm/boot/zImage
        echo "=== ARTIFACTS ARE zImage/zImage-dtb ONLY ==="
        echo "=== NOT A FLASHABLE boot.img ==="

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/build.log
        retention-days: 30

    - name: Upload kernel artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          kernel/arch/arm/boot/zImage
          kernel/arch/arm/boot/zImage-dtb
        retention-days: 30
